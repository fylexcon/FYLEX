services:
  postgres:
    image: postgres:16-alpine
    container_name: fylex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fylex
      POSTGRES_PASSWORD: fylex
      POSTGRES_DB: fylex
    ports:
      - "5432:5432"
    volumes:
      - fylex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fylex -d fylex"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fylex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fylex-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fylex-postgres-data:
  fylex-redis-data:
